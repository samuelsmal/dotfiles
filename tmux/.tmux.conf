set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# set to default shell
set-option -g default-shell "$SHELL"

# Faster escape (critical for vim/neovim in tmux)
set -sg escape-time 10

# Focus events (lets neovim detect pane switches)
set -g focus-events on

# set status line to top
set-option -g status-position top

# Status bar refresh interval
set -g status-interval 5

# --- Modern flat statusbar ---

# Status bar background: neutral dark tone (works in light & dark)
set -g status-style "bg=colour235,fg=colour248"

# Left: session name in teal pill
set -g status-left-length 30
set -g status-left "#[bg=colour6,fg=colour0,bold]  #S  #[bg=colour235] "

# Right: Claude Code info (from file) + time
set -g status-right-length 120
set -g status-right "#(~/.tmux/claude-status.sh)#[bg=colour240,fg=colour15]  %H:%M  "

# Window list styling
set -g window-status-format "#[fg=colour248,bg=colour235]  #I:#W  "
set -g window-status-current-format "#[fg=colour15,bg=colour4,bold]  #I:#W  "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour6"

# Message styling
set -g message-style "bg=colour6,fg=colour0,bold"

# --- End statusbar ---

# highlight window when it has new activity
setw -g monitor-activity on
set -g visual-activity on

# Navigation
# Vim-like pane navigation
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Mouse settings

set -g mouse on

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Toggle mouse on with C-b m
bind m \
  set -g mouse on \;\
  display 'Mouse: ON'


# Toggle mouse off with C-b m
bind M \
  set -g mouse off \;\
  display 'Mouse: OFF'

# Scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M

# To copy, drag to highlight text in yellow, press Enter and then release mouse
# Use vim keybindings in copy mode
setw -g mode-keys vi

# Cross-platform clipboard
if-shell "uname | grep -q Darwin" \
  'bind C-c run "tmux save-buffer - | pbcopy"' \
  'bind C-c run "tmux save-buffer - | xclip -i -sel clipboard"'

if-shell "uname | grep -q Darwin" \
  'bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"' \
  'bind C-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"'

# Quick Claude Code pane (prefix + C-a)
bind C-a split-window -h -l 40% \; send-keys 'claude' Enter
