# Solarized Dark tmux theme — true Solarized hex values
# base03=#002b36  base02=#073642  base01=#586e75  base00=#657b83
# base0=#839496   base1=#93a1a1   yellow=#b58900  orange=#cb4b16
# red=#dc322f     magenta=#d33682  violet=#6c71c4  blue=#268bd2
# cyan=#2aa198    green=#859900

set -g status-style "bg=#073642,fg=#93a1a1"
set -g status-left "#[bg=#2aa198,fg=#002b36,bold]  #S  #[bg=#073642] "
set -g status-right "#(~/.tmux/claude-status.sh)#[bg=#586e75,fg=#eee8d5]  %H:%M  "
set -g window-status-format "#[fg=#839496,bg=#073642]  #I:#W  "
set -g window-status-current-format "#[fg=#eee8d5,bg=#268bd2,bold]  #I:#W  "
set -g window-style "bg=#073642"
set -g window-active-style "bg=#002b36"
set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#2aa198"
set -g message-style "bg=#2aa198,fg=#002b36,bold"
