# Solarized Light tmux theme — true Solarized hex values
# base3=#fdf6e3   base2=#eee8d5   base1=#93a1a1   base0=#839496
# base00=#657b83  base01=#586e75  yellow=#b58900   orange=#cb4b16
# red=#dc322f     magenta=#d33682  violet=#6c71c4   blue=#268bd2
# cyan=#2aa198    green=#859900

set -g status-style "bg=#eee8d5,fg=#586e75"
set -g status-left "#[bg=#2aa198,fg=#fdf6e3,bold]  #S  #[bg=#eee8d5] "
set -g status-right "#(~/.tmux/claude-status.sh)#[bg=#93a1a1,fg=#fdf6e3]  %H:%M  "
set -g window-status-format "#[fg=#657b83,bg=#eee8d5]  #I:#W  "
set -g window-status-current-format "#[fg=#fdf6e3,bg=#268bd2,bold]  #I:#W  "
set -g window-style "bg=#eee8d5"
set -g window-active-style "bg=#fdf6e3"
set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#2aa198"
set -g message-style "bg=#2aa198,fg=#fdf6e3,bold"
