# Solarized Light tmux theme
set -g status-style "bg=colour254,fg=colour240"
set -g status-left "#[bg=colour6,fg=colour15,bold]  #S  #[bg=colour254] "
set -g status-right "#(~/.tmux/claude-status.sh)#[bg=colour252,fg=colour240]  %H:%M  "
set -g window-status-format "#[fg=colour240,bg=colour254]  #I:#W  "
set -g window-status-current-format "#[fg=colour254,bg=colour4,bold]  #I:#W  "
set -g pane-border-style "fg=colour252"
set -g pane-active-border-style "fg=colour6"
set -g message-style "bg=colour6,fg=colour15,bold"
